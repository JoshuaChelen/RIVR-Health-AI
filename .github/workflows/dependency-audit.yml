name: Dependency Audit

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 08:00 UTC to catch new CVEs between PRs.
    - cron: "0 8 * * 1"

jobs:
  pip-audit:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies (advisory)
        # pip-audit surfaces all advisories for the backend runtime deps. Advisory
        # (continue-on-error) so it reports without blocking on transitive/unfixable
        # ones; review the output for real backend-runtime CVEs.
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --desc

  npm-audit-root:
    name: Node (root package.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm install --ignore-scripts
        working-directory: .

      - name: Audit root npm dependencies (advisory)
        # --omit=dev focuses on shipped deps. Advisory because the Expo/React-Native
        # toolchain (babel, @bacons/xcode, @expo/xcpretty, shell-quote, …) carries
        # persistent transitive advisories that run at build time, not in the app bundle.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
        working-directory: .

  npm-audit-web:
    name: Node (web/package.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm install --ignore-scripts
        working-directory: web

      - name: Audit web npm dependencies (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
