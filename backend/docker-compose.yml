name: rivr-backend

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rivr
      POSTGRES_PASSWORD: rivr
      POSTGRES_DB: rivr
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rivr-minio
      MINIO_ROOT_PASSWORD: rivr-minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  createbuckets:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 rivr-minio rivr-minio-secret; do sleep 1; done;
      /usr/bin/mc mb -p local/rivr-media;
      /usr/bin/mc anonymous set none local/rivr-media;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: [.env]
    volumes: ["./:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: [.env]
    volumes: ["./:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: [.env]
    volumes: ["./:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
  miniodata:
