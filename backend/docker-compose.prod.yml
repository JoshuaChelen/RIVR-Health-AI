name: rivr-prod

# Production stack for a single host, behind Caddy (auto-HTTPS).
# Secrets/config come from .env.prod (created on the server, never committed).
# Bring up:  docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy publishes host ports (80/443); everything else is network-internal.

services:
  db:
    image: pgvector/pgvector:pg16
    command: postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/data/server.crt -c ssl_key_file=/var/lib/postgresql/data/server.key
    restart: unless-stopped
    env_file: [.env.prod]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: [.env.prod]
    volumes: ["miniodata:/data"]

  createbuckets:
    image: minio/mc
    depends_on: [minio]
    env_file: [.env.prod]
    # $$ escapes compose interpolation so the container shell expands the
    # env_file-injected creds at runtime.
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY; do echo waiting for minio; sleep 2; done;
      /usr/bin/mc mb -p local/rivr-media;
      /usr/bin/mc anonymous set none local/rivr-media;
      exit 0;
      "

  web:
    build: {context: ., dockerfile: Dockerfile}
    image: rivr-backend:latest
    restart: unless-stopped
    # Workers default to (2*CPU)+1 (gunicorn's recommendation) but can be pinned
    # via GUNICORN_WORKERS in .env.prod on small/large hosts. $$ escapes compose
    # interpolation so the container shell evaluates nproc at runtime.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-$$(( $$(nproc) * 2 + 1 ))} --timeout 120 --access-logfile - --error-logfile -"
    env_file: [.env.prod]
    # Pin prod settings here so the stack can never silently fall back to the
    # config.settings.dev default baked into wsgi/celery (DEBUG=True). Overrides
    # env_file; .env.prod also sets it, so they agree.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      createbuckets: {condition: service_completed_successfully}

  worker:
    image: rivr-backend:latest
    restart: unless-stopped
    # Concurrency defaults to CPU count; override with CELERY_CONCURRENCY in .env.prod.
    command: sh -c "celery -A config worker -l info --concurrency $${CELERY_CONCURRENCY:-$$(nproc)}"
    env_file: [.env.prod]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      web: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      createbuckets: {condition: service_completed_successfully}

  beat:
    image: rivr-backend:latest
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: [.env.prod]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      web: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Next.js web app (verify-email, reset-password, share) served at api.rivrhealth.ai/*.
  # No env_file: the only config (NEXT_PUBLIC_API_URL) is baked at build time, so no
  # secrets ever reach this container. Build context ./web exists on the server.
  webapp:
    build: {context: ./web, dockerfile: Dockerfile}
    image: rivr-webapp:latest
    restart: unless-stopped
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
      webapp: {condition: service_healthy}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
